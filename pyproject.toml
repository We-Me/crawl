# Merge of templates/uv/pyproject.toml; package=false removed at T003 after the
# build backend (hatchling) and src package discovery were configured.
[project]
name = "public-knowledge-collection"
version = "0.1.0"
description = "Public knowledge collection and standardized data delivery"
requires-python = ">=3.9,<3.10"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "defusedxml>=0.7.1,<1",
    "lxml>=5.3,<7",
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
    "pypdfium2>=4.30,<5",
    "python-docx>=1.1,<2",
    "pyyaml>=6.0.2,<7",
    "rapidocr-onnxruntime>=1.3,<2",
    "requests>=2.32,<3",
]

[project.scripts]
crawl = "crawler.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler"]

[tool.uv]
prerelease = "disallow"
index-strategy = "first-index"

[[tool.uv.index]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
# Replace the built-in PyPI default; do not add an official-PyPI fallback.
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
