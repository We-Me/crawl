  - source_id: IN-02
    source_name: MEA — Indian Treaties Database
    base_domain: www.mea.gov.in
    allowed_domains: [mea.gov.in, www.mea.gov.in]
    country: IN
    authority_level: A1
    categories: [A, G]
    # 人类入口 /treatylist-generic.htm 为前端壳（第 27 轮核验：静态 HTML 无文档链接），
    # 条约列表实际由该页脚本调用站点自身端点返回 HTML 片段（/FrontEnd/FetchTreatyListGenericLatest，第 28 轮核验）。
    entry_urls: ["https://www.mea.gov.in/FrontEnd/FetchTreatyListGenericLatest?page=1&PageSize=10&sortBy=sortby"]
    allowed_paths: []
    blocked_paths: [/login, /signin, /register, /user/, /admin]
    crawl_mode: list
    update_interval: weekly
    resource_kind: law
    update_policy:
      key: A          # S2 B101：A 每周检查 + 重大文件即时
      period_days: 7
      triggers: [major_document]
    parser_type: html
    language: en
    stance_default: IN_OFFICIAL
    robots_policy: "2026-09-11 核验：robots.txt 1 组 0 规则。2026-09-13 深度核验：人类入口 treatylist-generic.htm 与 TreatyList?1 均为前端壳（静态 HTML 无详情链接，第 27 轮）；列表由页面脚本调用的站点自身端点 /FrontEnd/FetchTreatyListGenericLatest 提供（第 28 轮归档，返回含 /TreatyDetail?<id> 链接的 HTML 片段），端点已登记为入口"
    terms_checked_at: "2026-09-13T17:36:00+08:00"
    seed_terms: [India, China, treaty, agreement, boundary, border, cooperation, peace, security, trade]
    supplement_terms: [bilateral, agreement]
    exclude_terms: []
    adapter:
      discovery: [list]
      list_link_pattern: "mea\\.gov\\.in/(TreatyDetail\\?\\d+|.*dtl/\\d+)"   # 第 28 轮核验：条约详情 URL 形态 /TreatyDetail?<id>；保留 ?dtl/<id> 兼容
      attachment_pattern: "mea\\.gov\\.in/Portal/LegalTreatiesDoc/"   # 第 38 轮核验：条约 PDF；详情页另有 4 个站点级 footer PDF，不属本来源附件
      # 2026-09-13 离线核验（本轮）：列表片段 ul.pagination 的“›”是 PagedList-skipToNext 项；
      # 通用 rel=next/文本启发式会先命中省略号（…→page=5），跳过第 2—4 页；未命中控件即终点。
      pagination_selector: "ul.pagination li.PagedList-skipToNext.page-item a.page-link"
      # 2026-09-13 线上核验（第 43/44 轮）：站点控件只带 page=N 且路径小写，直接跟随返回
      # “No Record Found”空壳；缺 PageSize/sortBy 才是原因（正确大小写、无参数同样为空）。
      # 按入口 URL 派生下一页（路径与 PageSize/sortBy 沿用入口，只覆盖 page）。
      pagination_merge_entry_params: true
