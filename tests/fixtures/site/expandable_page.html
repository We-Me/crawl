<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>虚构公告：展开正文样本</title></head>
<body>
<main>
  <h1>虚构公告：展开正文样本</h1>
  <p>正文第一部分：始终可见。</p>
  <details>
    <summary>展开全文</summary>
    <p>展开后的正文第二部分：脚本不执行也可从 DOM 抽取。</p>
  </details>
  <noscript><p>无脚本提示不应作为正文。</p></noscript>
</main>
</body>
</html>
