# 来源注册表（开发范围：source-adapters.md 登记的 18 个来源 + 1 个虚构示例）。
#
# - version 0.2.0：登记全部 18 个开发来源并启用；DEMO 仍是禁用示例（虚构域名，不发请求）。
# - enabled: true 表示“开发范围可执行”，不等于正式启用验收通过；正式启用名单/调度仍待 Q13，
#   逐站实现状态见 specs/001-public-knowledge-collection/evidence/t026-eighteen-sources.md。
# - 访问边界只允许本文件登记的域与路径；未登记域名、协议与路径一律拒绝。
# - robots_policy / terms_checked_at 记录 2026-09-11 五轮浅层核验（69 个请求）的结论；
#   运行期仍以实时 robots.txt 与保守规则为准，不因登记而放宽。
# - adapter.discovery 声明该来源已实现/已核验的发现方式；未声明的方式显式记为未实现，
#   不用空结果冒充成功。显式 --entry-url/--sitemap/--api 可按用户意图运行通用实现。
# - update_policy 键取自 S2 B101 知识库频率，按 source-adapters.md 中各来源“服务知识库”
#   映射；正式调度与启用范围仍待 Q13。
version: "0.2.0"
sources:
  # ---------- 中国来源（8） ----------
  - source_id: CN-01
    source_name: 中华人民共和国外交部（MFA）
    base_domain: www.mfa.gov.cn
    allowed_domains: [mfa.gov.cn, www.mfa.gov.cn]
    country: CN
    authority_level: A1
    categories: [A, B, D, G]
    entry_urls:
      - https://www.mfa.gov.cn/eng/
      - https://www.mfa.gov.cn/eng/wjbzhd/
      - https://www.mfa.gov.cn/eng/xw/zyxw/   # 2026-09-13 第 53 轮核实：Top Stories 栏目，7 条 2026-09 文章链接
    allowed_paths: []
    blocked_paths: [/login, /signin, /register, /user/, /admin]
    crawl_mode: list
    update_interval: daily
    resource_kind: news
    update_policy:
      key: B          # S2 B101：B 每日；A/D 增量由栏目遍历覆盖
      period_days: 1
      triggers: []
    parser_type: html
    language: zh
    stance_default: CN_OFFICIAL
    robots_policy: "2026-09-11 核验：robots.txt 无规则（groups=0/rules=0）。2026-09-13 增加文章链接规则：从已归档英文首页复算，仅保留 /eng/xw/zyxw/<YYYYMM>/t<id>_<id>.html 文章，过滤导航、站内搜索页与 cs.mfa.gov.cn 子域链接。2026-09-13 第 52/53 轮别名核实：旧域 www.fmprc.gov.cn 是外交部官方镜像（新域栏目导航 67 条指向它；/eng/wjb/zyzz/ 返回 23 KB 英文正文、SiteDomain=www.fmprc.gov.cn；其 robots.txt 302 到新域“系统维护”页、无 Allow/Disallow 指令），且与新域 /eng/xw/zyxw/ 列表字节一致（同 7 篇文章）→ 不把旧域加入 allowed_domains（避免不必要扩边界），改用新域栏目入口采集同一内容"
    terms_checked_at: "2026-09-13T21:05:00+08:00"
    seed_terms: [印度, 中印, 边境, 边界, 外交, 会谈, 会晤, 声明, 文件, 和平, 安全, 贸易, 关系, 合作]
    supplement_terms: [中印边境, 实际控制线, 边界与海洋事务司]
    exclude_terms: []
    adapter:
      discovery: [list]
      list_link_pattern: "mfa\\.gov\\.cn/eng/xw/zyxw/\\d{6}/t\\d+_\\d+\\.html$"   # 英文新闻文章；栏目索引 /eng/xw/zyxw/ 2026-09-13 第 53 轮线上核验（相对链接解析后命中）
      max_pages: 1
    request_rate_per_second: 0.5
    max_concurrency: 1
    connect_timeout_seconds: 10
    read_timeout_seconds: 20
    max_retries: 2
    enabled: true

  - source_id: CN-02
    source_name: 外交部条约数据库
    base_domain: treaty.mfa.gov.cn
    allowed_domains: [mfa.gov.cn, treaty.mfa.gov.cn]
    country: CN
    authority_level: A1
    categories: [A, G]
    entry_urls: [https://treaty.mfa.gov.cn/web/index.jsp]   # 站点根 / 是 JS 跳转壳（window.location→web/index.jsp）
    allowed_paths: []
    blocked_paths: [/login, /signin, /register, /user/, /admin]
    crawl_mode: list
    update_interval: weekly
    resource_kind: law
    update_policy:
      key: A          # S2 B101：A 每周检查 + 重大文件即时
      period_days: 7
      triggers: [major_document]
    parser_type: html
    language: zh
    stance_default: CN_OFFICIAL
    robots_policy: "2026-09-11 核验：robots.txt 404（视为无规则）。2026-09-13 深度核验：站点根 / 为 JS 跳转壳（387 字节→web/index.jsp）；web/index.jsp 含 GET/POST 检索表单 action=list.jsp（chnltype_c、keywords）；GET list.jsp?chnltype_c=all&keywords=<词> 服务端渲染 10 条 detail1.jsp?objid=<id> 结果与 ?nPageIndex_=N 翻页"
    terms_checked_at: "2026-09-13T17:07:00+08:00"
    seed_terms: [边界, 边境, 协定, 协议, 条约, 关系, 合作, 机制, 和平, 安全, 贸易]
    supplement_terms: [印度共和国, 边界海洋]
    exclude_terms: [海洋]
    search_url_template: "https://treaty.mfa.gov.cn/web/list.jsp?chnltype_c=all&keywords={query}"
    adapter:
      discovery: [search]   # 2026-09-13：按站内检索（GET list.jsp）实现；列表规则只保留 detail1 详情
      list_link_pattern: "detail1\\.jsp\\?objid=\\d+"
      # 2026-09-13 离线核验（本轮）：检索结果页 ?nPageIndex_=N 的“下一页”是 .page 第 3 个 li 的
      # 链接（首页/上一页/下一页/尾页；本页页 2 的下一页为 nPageIndex_=3）；
      # 未命中则按适配规则视为终点，不再用通用文本启发式。
      pagination_selector: ".page li:nth-child(3) a"
      max_pages: 5
    request_rate_per_second: 0.5
    max_concurrency: 1
    connect_timeout_seconds: 10
    read_timeout_seconds: 20
    max_retries: 2
    enabled: true

